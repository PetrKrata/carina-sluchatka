<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Sluchátka – Planetárium</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <div class="eyebrow">Planetárium Praha</div>
        <h1>Sluchátka</h1>
      </div>
      <button id="refreshBtn" class="icon-btn" type="button" aria-label="Obnovit pořady">↻</button>
    </header>

    <section class="card">
      <div id="dateLabel" class="date"></div>

      <label class="label" for="showSelect">Pořad</label>
      <select id="showSelect" class="select"></select>

      <div id="showMeta" class="show-meta"></div>
    </section>

    <section class="card">
      <label class="label" for="headphonesInput">Počet půjčených sluchátek</label>

      <input
        id="headphonesInput"
        class="number-input"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="off"
        enterkeyhint="done"
        placeholder="0"
        maxlength="3"
      >

      <button id="saveBtn" class="save-btn" type="button">ULOŽIT</button>
      <button id="editBtn" class="edit-btn" type="button" hidden>EDITOVAT</button>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <button id="changeShowBtn" class="secondary-btn" type="button">Vybrat jiný pořad</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
