<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Sluchátka – Planetárium</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <div class="eyebrow">Planetárium Praha</div>
        <h1>Sluchátka</h1>
      </div>
      <button id="refreshBtn" class="icon-btn" type="button" aria-label="Obnovit pořady">↻</button>
    </header>

    <section class="card">
      <div id="dateLabel" class="date"></div>

      <label class="label" for="showSelect">Pořad</label>
      <select id="showSelect" class="select"></select>

      <div id="showMeta" class="show-meta"></div>
    </section>

    <section class="card">
      <label class="label" for="headphonesInput">Počet půjčených sluchátek</label>

      <input
        id="headphonesInput"
        class="number-input"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="off"
        enterkeyhint="done"
        placeholder="0"
        maxlength="3"
      >

      <button id="saveBtn" class="save-btn" type="button">ULOŽIT</button>
      <button id="editBtn" class="edit-btn" type="button" hidden>EDITOVAT</button>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <button id="changeDateBtn" class="secondary-btn" type="button">Vybrat datum</button>
    <button id="statsBtn" class="secondary-btn stats-open-btn" type="button">Statistiky</button>
  </main>


  <section id="datePickerPanel" class="date-picker-panel" hidden>
    <div class="date-picker-box">
      <div class="date-picker-header">
        <h2>Vybrat datum</h2>
        <button id="datePickerCloseBtn" class="date-picker-close" type="button" aria-label="Zavřít">×</button>
      </div>

      <div class="date-picker-body">
        <p>Vyber dnešek nebo některý z předchozích 6 dní.</p>

        <label for="datePickerInput">Datum</label>
        <input id="datePickerInput" type="date">

        <button id="datePickerApplyBtn" class="date-picker-apply" type="button">
          NAČÍST DEN
        </button>
      </div>
    </div>
  </section>

  <section id="statsPanel" class="stats-panel" hidden>
    <div class="stats-header">
      <h2>Statistiky sluchátek</h2>
      <button id="statsCloseBtn" class="stats-close-btn" type="button" aria-label="Zavřít">×</button>
    </div>

    <div class="stats-body">
      <div class="stats-controls">
        <label>
          Od
          <input id="statsFrom" type="date">
        </label>

        <label>
          Do
          <input id="statsTo" type="date">
        </label>

        <label>
          Záznam
          <select id="statsFilter">
            <option value="all">Všechny záznamy</option>
            <option value="entered">Pouze se zadaným počtem</option>
            <option value="missing">Pouze bez záznamu</option>
          </select>
        </label>

        <label>
          Typ pořadu
          <select id="statsTypeFilter">
            <option value="all">Všechny pořady</option>
            <option value="modry">Školní</option>
            <option value="hnedy">Veřejnost</option>
          </select>
        </label>

        <button id="statsLoadBtn" class="stats-action-btn" type="button">NAČÍST</button>
        <button id="statsExportBtn" class="stats-action-btn stats-export-btn" type="button" disabled>EXPORT CSV</button>
      </div>

      <div id="statsStatus" class="stats-status">Vyber období a načti statistiky.</div>
      <div id="statsResults"></div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
